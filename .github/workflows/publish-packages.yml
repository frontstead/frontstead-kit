name: Publish Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14'
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify release artifacts
        run: npm run release:check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/frontstead_test

      # Each step skips a version that is already on the registry, so a release
      # where only one package changed does not fail on the others. Keep tokens
      # before ui: ui depends on it.
      - name: Publish tokens
        run: node scripts/publish-if-needed.mjs packages/tokens

      - name: Publish UI
        run: node scripts/publish-if-needed.mjs packages/ui

      - name: Publish API client
        run: node scripts/publish-if-needed.mjs packages/api-client
