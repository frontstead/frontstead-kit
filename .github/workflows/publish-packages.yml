name: Publish Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14'
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify release artifacts
        run: npm run release:check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/frontstead_test

      - name: Publish tokens
        run: npm publish --workspace=@frontstead/tokens --access public --provenance

      - name: Publish UI
        run: npm publish --workspace=@frontstead/ui --access public --provenance

      - name: Publish API client
        run: npm publish --workspace=@frontstead/api-client --access public --provenance
